services:
  model-jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8889:8889"
    volumes:
      - type: bind
        source: .
        target: "/workspace/Project/Model pipeline"
      - type: bind
        source: "../Data pipeline"
        target: "/workspace/Project/Data pipeline"
        read_only: true
      - type: bind
        source: "../Evaluation pipeline"
        target: "/workspace/Project/Evaluation pipeline"
    working_dir: "/workspace/Project/Model pipeline"
    # Override the Dockerfile's root_dir so BOTH Model pipeline and
    # Evaluation pipeline show up in the Jupyter file browser.
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8889", "--no-browser", "--allow-root", "--ServerApp.root_dir=/workspace/Project"]
